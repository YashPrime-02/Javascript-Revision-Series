<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chai aur code | DOM</title>
</head>

<body style="background-color: #212121; color: #fff;">

    <!-- ==========================================
         📘 Unordered List
    ========================================== -->

    <ul class="language">

        <li>Javascript</li>

    </ul>

</body>

<script>

    // ==========================================
    // 📘 Create & Add Element
    // ==========================================

    function addLanguage(langName){

        // Create li element

        const li = document.createElement('li');


        // Add text using innerHTML

        li.innerHTML = `${langName}`


        // Append li inside ul

        document.querySelector('.language').appendChild(li)
    }


    addLanguage("python")

    addLanguage("typescript")


    // Output:
    // Javascript
    // python
    // typescript


    // ==========================================
    // 📘 Optimized Approach
    // ==========================================

    // Better than innerHTML
    // because it directly creates text node

    function addOptiLanguage(langName){

        const li = document.createElement('li');


        // Create text node

        li.appendChild(document.createTextNode(langName))


        // Append to list

        document.querySelector('.language').appendChild(li)
    }


    addOptiLanguage('golang')


    // Output:
    // golang added in list


    // ==========================================
    // 📘 Edit Element
    // ==========================================

    const secondLang = document.querySelector("li:nth-child(2)")

    console.log(secondLang);


    // Output:
    // <li>python</li>


    // Replace existing element

    // secondLang.innerHTML = "Mojo"


    const newli = document.createElement('li')

    newli.textContent = "Mojo"


    secondLang.replaceWith(newli)


    // Output:
    // python replaced with Mojo


    // ==========================================
    // 📘 Edit using outerHTML
    // ==========================================

    const firstLang = document.querySelector("li:first-child")


    firstLang.outerHTML = '<li>TypeScript</li>'


    // Output:
    // Javascript replaced with TypeScript


    // ==========================================
    // 📘 Remove Element
    // ==========================================

    const lastLang = document.querySelector('li:last-child')


    lastLang.remove()


    // Output:
    // Last element removed from list


    // ==========================================
    // 📘 Final List Output
    // ==========================================

    // TypeScript
    // Mojo
    // typescript

</script>

</html>
