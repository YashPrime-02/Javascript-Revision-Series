<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Digital Clock</title>
    <link rel="stylesheet" href="28_project_3.css" />
  </head>
  <body>
    <div class="container">
      <h1>Digital Clock</h1>
      <p class="subtitle">Live Time & Date with 12/24 Hour Toggle</p>
      <div class="date" id="date">Monday, 1 January 2026</div>
      <div class="clock-wrapper">
        <div id="clock">00:00:00</div>
        <span id="ampm">AM</span>
      </div>
      <button id="toggle-format">Switch to 24 Hour Format</button>
      <div class="analog-clock">
        <div class="hand hour" id="hour-hand"></div>
        <div class="hand minute" id="minute-hand"></div>
        <div class="hand second" id="second-hand"></div>
        <div class="center-dot"></div>
        <span class="number number1">12</span>
        <span class="number number2">3</span>
        <span class="number number3">6</span>
        <span class="number number4">9</span>
      </div>
    </div>
    <script src="28_project_3.js"></script>
  </body>
</html>
