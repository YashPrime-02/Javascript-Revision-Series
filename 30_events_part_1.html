<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTML Events</title>
</head>

<body style="background-color: #414141; color: aliceblue;">

    <h2>Amazing image</h2>

    <div>

        <!-- ==========================================
             📘 Image List
        ========================================== -->

        <ul id="images">

            <li>
                <img width="200px"
                     id="photoshop"
                     src="https://images.pexels.com/photos/3561339/pexels-photo-3561339.jpeg"
                     alt="photoshop">
            </li>

            <li>
                <img width="200px"
                     id="japan"
                     src="https://images.pexels.com/photos/3532553/pexels-photo-3532553.jpeg"
                     alt="">
            </li>

            <li>
                <img width="200px"
                     id="river"
                     src="https://images.pexels.com/photos/3532551/pexels-photo-3532551.jpeg"
                     alt="">
            </li>

            <li>
                <img width="200px"
                     id="owl"
                     src="https://images.pexels.com/photos/3532552/pexels-photo-3532552.jpeg"
                     alt="">
            </li>

            <li>
                <img width="200px"
                     id="prayer"
                     src="https://images.pexels.com/photos/2522671/pexels-photo-2522671.jpeg"
                     alt="">
            </li>

            <li>
                <a style="color: aliceblue;"
                   href="https://google.com"
                   id="google">
                   Google
                </a>
            </li>

        </ul>

    </div>

</body>

<script>

    // ==========================================
    // 📘 onclick Example
    // ==========================================

    // document.getElementById('owl').onclick = function(){

    //     alert("owl clicked")
    // }


    // Older approach for events


    // ==========================================
    // 📘 addEventListener()
    // ==========================================

    // Modern and preferred approach


    // Syntax:
    // addEventListener(type, callback, propagation)


    // ==========================================
    // 📘 Event Important Properties
    // ==========================================

    // type
    // timestamp
    // defaultPrevented

    // target
    // currentTarget

    // clientX, clientY
    // screenX, screenY

    // altKey, ctrlKey, shiftKey


    // ==========================================
    // 📘 Event Bubbling
    // ==========================================

    // false => bubbling phase (default)


    // document.getElementById('images')
    // .addEventListener('click', function(e){

    //     console.log("clicked inside the ul");

    // }, false)


    // document.getElementById('owl')
    // .addEventListener('click', function(e){

    //     console.log("owl clicked");

    //     e.stopPropagation()

    // }, false)


    // Output when owl clicked:
    // owl clicked


    // stopPropagation()
    // prevents bubbling to parent


    // ==========================================
    // 📘 preventDefault()
    // ==========================================

    // document.getElementById('google')
    // .addEventListener('click', function(e){

    //     e.preventDefault();

    //     e.stopPropagation()

    //     console.log("google clicked");

    // }, false)


    // preventDefault()
    // stops default browser action


    // ==========================================
    // 📘 Event Delegation
    // ==========================================

    // Single event listener on parent

    document.querySelector('#images')
    .addEventListener('click', function(e){

        console.log(e.target.tagName);


        // Check clicked element is image

        if (e.target.tagName === 'IMG') {

            console.log(e.target.id);


            // Select parent li

            let removeIt = e.target.parentNode


            // Remove element

            removeIt.remove()
        }

    })


    // Alternative remove method

    // removeIt.parentNode.removeChild(removeIt)


    // ==========================================
    // 📘 Output Example
    // ==========================================

    // Clicking owl image:

    // IMG
    // owl

    // owl image removed from page

</script>

</html>
